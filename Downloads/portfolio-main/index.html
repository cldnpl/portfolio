    <!--
      Every family the site uses, in one request, made by the HTML parser.
      These used to be two `@import` rules inside stylesheets that are
      themselves loaded by the JavaScript bundle: the browser could not even
      learn that the fonts existed until the bundle had been fetched, parsed
      and run, so the first paint of the page was always in fallback type and
      then reflowed. Declared here they are in flight with the first byte.
    -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@200;300;400&family=Cormorant+Garamond:wght@500;600&family=Press+Start+2P&family=Space+Mono:wght@400;700&display=swap"
